name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Ensure committed HTML matches the source
        run: git diff --exit-code -- index.html resume-formatter.html dist/resume-formatter.html
